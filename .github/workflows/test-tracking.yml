name: Test Tracking Stack

on:
  push:
    branches: [marketing/tracking-v1]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install FingerprintJS
        run: npm install @fingerprintjs/fingerprintjs
        
      - name: Build
        run: npm run build
        
      - name: Test Worker
        run: |
          npm install -g wrangler
          wrangler deploy --dry-run --outdir dist
          
      - name: Verify tracking files
        run: |
          test -f functions/collect.ts && echo "✓ Worker exists"
          test -f src/lib/tracking/fingerprint.ts && echo "✓ Fingerprint module exists"
          test -f src/components/ConsentBanner.tsx && echo "✓ ConsentBanner exists"
          test -f src/hooks/useConsent.ts && echo "✓ useConsent hook exists"
