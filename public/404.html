<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Página não encontrada | Varanda Ypê</title>
    <meta name="theme-color" content="#0e351b" />
    <link rel="icon" type="image/png" href="/logo-varanda-icon.png" />
    <style>
      :root {
        --green: #0e351b;
        --cream: #f4eed7;
        --ink: #1c1c1c;
        --red: #ea1d2c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        background: var(--cream);
        color: var(--ink);
        font-family: "Source Sans 3", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
      }
      main {
        width: 100%;
        max-width: 520px;
        text-align: center;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 28px;
        font-weight: 700;
        font-size: 18px;
        color: var(--green);
        text-decoration: none;
      }
      .brand img { width: 40px; height: 40px; border-radius: 10px; }
      h1 {
        font-family: "Fraunces", Georgia, "Times New Roman", serif;
        font-size: clamp(28px, 7vw, 40px);
        line-height: 1.15;
        margin: 0 0 12px;
        color: var(--green);
      }
      p { margin: 0 auto 28px; max-width: 42ch; }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      .actions a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 999px;
        font-weight: 600;
        text-decoration: none;
        border: 1.5px solid var(--green);
      }
      .actions a.primary { background: var(--green); color: var(--cream); }
      .actions a.ghost { background: transparent; color: var(--green); }
      .actions a.primary:hover { background: var(--green-deep, #082713); }
      .actions a.ghost:hover { background: rgba(14, 53, 27, 0.08); }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/">
        <img src="/logo-icon-96.png" alt="" width="40" height="40" />
        <span>Varanda Ypê</span>
      </a>
      <h1>Essa página saiu do cardápio</h1>
      <p>
        O endereço que você abriu não existe ou foi movido. Volte para a home
        ou vá direto para o que você procura.
      </p>
      <div class="actions">
        <a class="primary" href="/">Ir para a home</a>
        <a class="ghost" href="/menu/">Ver cardápio</a>
        <a class="ghost" href="/delivery/">Pedir delivery</a>
      </div>
    </main>
  </body>
</html>
