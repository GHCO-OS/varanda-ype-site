<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Página não encontrada | Varanda Ypê</title>
    <meta name="theme-color" content="#0e351b" />
    <link rel="icon" type="image/png" href="/logo-varanda-icon.png" />
    <style>
      :root {
        --green: #0e351b;
        --green-deep: #082713;
        --cream: #f4eed7;
        --gold: #c9a84c;
        --ink: #1c1c1c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        background: var(--cream);
        color: var(--ink);
        font-family: "Source Sans 3", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
      }
      main { width: 100%; max-width: 560px; text-align: center; }
      .capy {
        position: relative;
        display: inline-block;
        width: 168px;
        height: 168px;
        margin-bottom: 20px;
      }
      .capy img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        box-shadow: 0 18px 40px rgba(8, 39, 19, 0.22);
      }
      /* Eyelid over the logo's eye, so the capivara blinks while it "looks around". */
      .capy::after {
        content: "";
        position: absolute;
        left: 73px;
        top: 61px;
        width: 14.5px;
        height: 8px;
        border-radius: 50%;
        background: rgb(248, 235, 215);
        transform: scaleY(0);
        transform-origin: top;
      }
      @media (prefers-reduced-motion: no-preference) {
        .capy { animation: look 5s ease-in-out infinite; }
        .capy::after { animation: blink 5s infinite; }
      }
      @keyframes look {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-6deg); }
        55% { transform: rotate(5deg); }
      }
      @keyframes blink {
        0%, 40%, 46%, 80%, 86%, 100% { transform: scaleY(0); }
        42%, 44%, 82%, 84% { transform: scaleY(1); }
      }
      .code {
        margin: 0 0 6px;
        color: var(--gold);
        font-family: "Montserrat", Arial, sans-serif;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        font-family: "Fraunces", Georgia, "Times New Roman", serif;
        font-size: clamp(28px, 7vw, 40px);
        line-height: 1.15;
        margin: 0 0 12px;
        color: var(--green);
      }
      p { margin: 0 auto 28px; max-width: 44ch; }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
      }
      .actions a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 999px;
        font-weight: 700;
        text-decoration: none;
        border: 1.5px solid var(--green);
        color: var(--green);
      }
      .actions a.primary { background: var(--gold); border-color: var(--gold); color: var(--green-deep); }
      .actions a:hover { background: rgba(14, 53, 27, 0.08); }
      .actions a.primary:hover { background: #d8b95d; }
      .home { display: inline-block; margin-top: 22px; color: var(--green); font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <a class="capy" href="/" aria-label="Voltar para a home do Varanda Ypê">
        <img src="/logo-varanda-icon.png" alt="" width="168" height="168" />
      </a>
      <p class="code">Erro 404</p>
      <h1>A capivara procurou, mas essa página não está no cardápio</h1>
      <p>
        O endereço que você abriu não existe ou mudou de lugar. Mas a cozinha
        continua aberta: escolha por onde seguir.
      </p>
      <div class="actions">
        <a class="primary" href="/delivery/">Pedir delivery</a>
        <a href="/menu/">Ver cardápio</a>
        <a href="/marmitaria/">Marmitaria</a>
        <a href="https://wa.me/551931991971" target="_blank" rel="noreferrer">WhatsApp</a>
      </div>
      <a class="home" href="/">Voltar para a home</a>
    </main>
  </body>
</html>
